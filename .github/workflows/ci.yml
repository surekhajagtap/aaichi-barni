name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets you re-run the pipeline by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Confirm no real order data was committed
        run: |
          if git ls-files --error-unmatch data/db.json >/dev/null 2>&1; then
            echo "::error::data/db.json is tracked. It holds customer names, phone numbers and addresses and must stay gitignored."
            exit 1
          fi
          if [ "$(jq '.orders | length' data/db.seed.json)" != "0" ]; then
            echo "::error::data/db.seed.json contains orders. The seed must ship with an empty orders array."
            exit 1
          fi
          echo "No customer data in version control."

  build-pages:
    name: Build the static site
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Pages serves the site from /<repo>/, so links and assets need the prefix.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Where checkout posts orders. These are baked into the browser bundle
          # and are meant to be public, which is why they are vars, not secrets.
          # Leave them unset and checkout says ordering is not open yet.
          NEXT_PUBLIC_ORDER_FORM_ENDPOINT: ${{ vars.ORDER_FORM_ENDPOINT }}
          NEXT_PUBLIC_ORDER_FORM_KEY: ${{ vars.ORDER_FORM_KEY }}
        run: npm run build

      - name: Report whether ordering is switched on
        run: |
          if [ -z "${{ vars.ORDER_FORM_ENDPOINT }}" ]; then
            echo "::warning::ORDER_FORM_ENDPOINT is not set, so checkout will show 'ordering opens soon'. Add it under Settings → Secrets and variables → Actions → Variables."
          else
            echo "Ordering is enabled."
          fi

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Publish to GitHub Pages
    needs: build-pages
    # Only real pushes to master publish. The environment below holds each run
    # until a reviewer approves it, so nothing reaches the live site unseen.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the published site responds
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url" || true)
            if [ "$code" = "200" ]; then
              echo "$url returned 200."
              echo "### Published :rocket:" >> "$GITHUB_STEP_SUMMARY"
              echo "$url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: got '$code', retrying in 10s."
            sleep 10
          done
          echo "::error::$url did not return 200 after 5 attempts (last: '$code')."
          exit 1
