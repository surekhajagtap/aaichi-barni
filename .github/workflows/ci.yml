name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets you re-run the pipeline by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # data/db.json is gitignored, so it is absent on a clean checkout.
      # src/lib/db.ts creates it from data/db.seed.json on first read, which is
      # exactly what the static product pages do during the build below.
      - name: Build
        run: npm run build

      - name: Confirm no real order data was committed
        run: |
          if git ls-files --error-unmatch data/db.json >/dev/null 2>&1; then
            echo "::error::data/db.json is tracked. It holds customer names, phone numbers and addresses and must stay gitignored."
            exit 1
          fi
          if [ "$(jq '.orders | length' data/db.seed.json)" != "0" ]; then
            echo "::error::data/db.seed.json contains orders. The seed must ship with an empty orders array."
            exit 1
          fi
          echo "No customer data in version control."

  deploy:
    name: Deploy to Vercel
    needs: verify
    # Only real pushes to master deploy. Pull requests run the checks above and stop there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Without this the Vercel CLI fails with an opaque auth error.
      - name: Confirm deploy secrets are present
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Deploy secrets present."

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deployed site responds
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "$url returned 200."
              exit 0
            fi
            echo "Attempt $attempt: got '$code', retrying in 10s."
            sleep 10
          done
          echo "::error::$url did not return 200 after 5 attempts (last: '$code')."
          exit 1
